# Kushalaya CI — requires workforceos-core (private sibling repo).
#
# GitHub Actions cannot clone another private repo with the default GITHUB_TOKEN.
# Add a repo secret:
#   WORKFORCEOS_CORE_PAT — fine-grained PAT with read access to krishnaposa/workforceos-core
# Or make workforceos-core public (then PAT is optional but still recommended for rate limits).

name: Kushalaya CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krishnaposa/workforceos-core
          ref: develop
          path: workforceos-core
          token: ${{ secrets.WORKFORCEOS_CORE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        env:
          WORKFORCEOS_CORE: ${{ github.workspace }}/workforceos-core
        run: |
          python -m venv .venv
          bash ../scripts/install-backend-deps.sh
      - name: Verify core contract
        env:
          WORKFORCEOS_CORE: ${{ github.workspace }}/workforceos-core
        run: .venv/bin/python ../scripts/verify_workforceos_core.py
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret
          ENABLE_TELEMETRY: "false"
          ENVIRONMENT: test
        run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krishnaposa/workforceos-core
          ref: develop
          path: workforceos-core
          token: ${{ secrets.WORKFORCEOS_CORE_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build @workforceos/contracts
        run: npm ci && npm run build
        working-directory: workforceos-core/typescript
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krishnaposa/workforceos-core
          ref: develop
          path: workforceos-core
          token: ${{ secrets.WORKFORCEOS_CORE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build @workforceos/contracts
        run: npm ci && npm run build
        working-directory: workforceos-core/typescript
      - name: Install backend
        working-directory: backend
        env:
          WORKFORCEOS_CORE: ${{ github.workspace }}/workforceos-core
        run: |
          python -m venv .venv
          bash ../scripts/install-backend-deps.sh
          .venv/bin/python -m app.init_db
          .venv/bin/python -m app.db_migrate
          .venv/bin/python -m app.seed_db
          .venv/bin/python -m app.seed_academy
          .venv/bin/python -m app.seed_super_admin
      - name: Install frontend and Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        env:
          CI: true
          SECRET_KEY: ci-test-secret
          ENABLE_TELEMETRY: "false"
          ENVIRONMENT: test
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
