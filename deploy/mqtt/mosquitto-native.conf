# LiveWell IoT — Mosquitto drop-in (native package)
# Installed to /etc/mosquitto/conf.d/livewell.conf by install-livewell-mqtt.sh
# Runtime: /var/lib/safehomeops/mqtt/

# Required when password_file / allow_anonymous differ per listener
per_listener_settings true

persistence true
persistence_location /var/lib/safehomeops/mqtt/data/

# systemd captures stdout/stderr into the journal
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Local only — LiveWell iot_ingestor
listener 1883 127.0.0.1
allow_anonymous false
password_file /var/lib/safehomeops/mqtt/passwd
acl_file /var/lib/safehomeops/mqtt/acl

# Public MQTTS for MG7 hubs
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /var/lib/safehomeops/mqtt/passwd
acl_file /var/lib/safehomeops/mqtt/acl
cafile /var/lib/safehomeops/mqtt/certs/fullchain.pem
certfile /var/lib/safehomeops/mqtt/certs/fullchain.pem
keyfile /var/lib/safehomeops/mqtt/certs/privkey.pem
require_certificate false
tls_version tlsv1.2
