# Mosquitto — LiveWell IoT (co-located with API)

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Local only — ingestor / admin tools
listener 1883 127.0.0.1
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Public MQTTS for MG7 hubs — mount Let's Encrypt (or copied) certs
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# Adjust host paths in docker-compose volume mounts
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
require_certificate false
