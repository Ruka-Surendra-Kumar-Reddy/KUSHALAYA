# Legacy family.tekmatrix.ai → public marketing on livewell.tekmatrix.ai

server {
    listen 80;
    listen [::]:80;
    server_name family.tekmatrix.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://livewell.tekmatrix.ai$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name family.tekmatrix.ai;

    ssl_certificate     /etc/letsencrypt/live/family.tekmatrix.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family.tekmatrix.ai/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://livewell.tekmatrix.ai$request_uri;
    }
}
