# KushAlaya caregiver field app — caregiver.kushalaya.com (Next :3010 / API :8010)
#
# Caregivers get their own host. Next middleware (isCaregiverHost in
# lib/hosts.ts) keeps it to /caregiver, /login and password reset, so the Host
# header must reach Next unchanged — do not rewrite or normalise it here.
#
# Certs: /etc/letsencrypt/live/caregiver.kushalaya.com/

server {
    listen 80;
    listen [::]:80;
    server_name caregiver.kushalaya.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caregiver.kushalaya.com;

    ssl_certificate     /etc/letsencrypt/live/caregiver.kushalaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caregiver.kushalaya.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Caregivers upload visit photos from this host.
    client_max_body_size 25M;

    location /health {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
