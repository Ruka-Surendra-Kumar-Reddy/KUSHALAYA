# Apex kushalaya.com → www.kushalaya.com (HTTP only, before TLS cert exists)

server {
    listen 80;
    listen [::]:80;
    server_name kushalaya.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.kushalaya.com$request_uri;
    }
}
