# Apex kushalaya.com → public marketing on www.kushalaya.com

server {
    listen 80;
    listen [::]:80;
    server_name kushalaya.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.kushalaya.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kushalaya.com;

    ssl_certificate     /etc/letsencrypt/live/kushalaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kushalaya.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.kushalaya.com$request_uri;
    }
}
