# Kushalaya STAGING — staging-ops / staging-www / staging-family .kushalaya.com
#
# A second copy of the app on the same VM (/opt/safehomeops-staging/app,
# units safehomeops-staging-api :8020 and safehomeops-staging-web :3020,
# database safehomeops_staging). Installed by scripts/deploy/install-staging.sh.
#
# Host-based, exactly like production: Next middleware (frontend/lib/hosts.ts)
# lists the three staging hostnames, so the Host header must reach Next
# unchanged — do not rewrite or normalise it here.
#
# One certificate for all three names:
#   certbot certonly --webroot -w /var/www/certbot --cert-name staging.kushalaya.com \
#     -d staging-ops.kushalaya.com -d staging-www.kushalaya.com -d staging-family.kushalaya.com
# Certs: /etc/letsencrypt/live/staging.kushalaya.com/
#
# Before the cert exists use staging.kushalaya.com-http-only.conf.

server {
    listen 80;
    listen [::]:80;
    server_name staging-ops.kushalaya.com staging-www.kushalaya.com staging-family.kushalaya.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- staging-ops: ops portal + API (same shape as ops.kushalaya.com.conf) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-ops.kushalaya.com;

    ssl_certificate     /etc/letsencrypt/live/staging.kushalaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.kushalaya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Never let a search engine index the staging copy.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 15M;

    location /health {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

