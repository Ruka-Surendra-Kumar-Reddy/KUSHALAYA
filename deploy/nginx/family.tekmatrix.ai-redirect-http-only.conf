# Legacy family.tekmatrix.ai → livewell.tekmatrix.ai (HTTP only / pre-TLS)

server {
    listen 80;
    listen [::]:80;
    server_name family.tekmatrix.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://livewell.tekmatrix.ai$request_uri;
    }
}
