# Kushalaya STAGING — HTTP only, before the TLS certificate exists.
# certbot answers the ACME challenge over port 80 from /var/www/certbot; once
# the cert is issued install-staging.sh swaps in staging.kushalaya.com.conf.
# Host header must reach Next unchanged (frontend/lib/hosts.ts routes by it).

server {
    listen 80;
    listen [::]:80;
    server_name staging-ops.kushalaya.com staging-www.kushalaya.com staging-family.kushalaya.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    client_max_body_size 15M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location /health {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
