# Kushalaya family portal — family.kushalaya.com (HTTP only)
#
# Used before a TLS certificate exists: certbot needs to answer the ACME
# challenge over port 80. Once the cert is issued, replace this with
# family.kushalaya.com.conf.
#
# The app serves the family portal on this host via Next middleware, which
# rewrites family.kushalaya.com/<path> -> /kushalaya/family/<path>. The Host
# header must therefore reach Next untouched.

server {
    listen 80;
    listen [::]:80;
    server_name family.kushalaya.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    client_max_body_size 15M;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
