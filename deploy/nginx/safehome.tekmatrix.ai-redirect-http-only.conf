# Legacy safehome.tekmatrix.ai → livewellops.tekmatrix.ai (HTTP only)

server {
    listen 80;
    listen [::]:80;
    server_name safehome.tekmatrix.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://livewellops.tekmatrix.ai$request_uri;
    }
}
